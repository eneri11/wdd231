<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Directory | Akyat-Tanaw</title>
    <meta name="description"
      content="Explore 15+ top mountain trails with elevation details, photos, and view decks.">
    <meta name="author" content="Irene Gavina Costales">

    <link rel="stylesheet" href="styles/styles.css">
    
    <script type="module">
        import { getTrailData, displayTrails, setupFilters } from './scripts/fetch.mjs';
        import { initModal } from './scripts/modal.mjs';

        document.addEventListener('DOMContentLoaded', async () => {
            const trails = await getTrailData();
            displayTrails(trails, '#trail-cards');
            setupFilters(trails);
            initModal(trails);
        });
    </script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/akyat_tanaw_logo.jpg" alt="Akyat-Tanaw Logo" width="50" height="50">
            <span>Akyat-Tanaw</span>
        </div>
        <button id="menu-toggle" aria-label="Toggle Navigation Menu">&#9776;</button>
        <nav id="primary-nav">
            <a href="index.html">Home</a>
            <a href="trails.html">Trails</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Mountain Trail Directory</h1>

        <div class="filter-controls">
            <label for="difficulty-filter">Filter by Difficulty:</label>
            <select id="difficulty-filter">
                <option value="all">All Difficulties</option>
                <option value="easy">Easy</option>
                <option value="moderate">Moderate</option>
                <option value="challenging">Challenging</option>
            </select>
        </div>

        <div id="trail-cards" class="card-grid">
            <!-- Dynamically populated via JavaScript -->
        </div>

        <!-- Accessible Modal Dialog -->
        <dialog id="trail-dialog">
            <div id="dialog-details"></div>
            <button id="dialog-close" class="cta-button">Close</button>
        </dialog>
    </main>

    <footer>
        <p>&copy; 2026 Akyat-Tanaw | WDD 231</p>
        <p><a href="attributions.html">Attributions</a> | <a href="YOUR_YOUTUBE_URL_HERE"
              target="_blank" rel="noopener">Video Demonstration</a></p>
    </footer>
</body>

</html>
