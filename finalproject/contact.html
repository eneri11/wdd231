<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Akyat-Tanaw</title>
    <meta name="description"
      content="Send us trail inquiries, feedback, or report trail status updates.">
    <meta name="author" content="Irene Gavina Costales">

    <link rel="icon" href="images/akyat_tanaw.ico">
    <link rel="stylesheet" href="styles/styles.css">
    <script type="module" src="scripts/main.mjs"></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/akyat_tanaw_logo.jpg" alt="Akyat-Tanaw Logo" width="50" height="50">
            <span>Akyat-Tanaw</span>
        </div>
        <button id="menu-toggle" aria-label="Toggle Navigation Menu">&#9776;</button>
        <nav id="primary-nav">
            <a href="index.html">Home</a>
            <a href="trails.html">Trails</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Contact & Trail Inquiries</h1>

        <form action="join.html" method="get" class="trail-form">
            <label for="fname">First Name *</label>
            <input type="text" id="fname" name="First_Name" required>

            <label for="lname">Last Name *</label>
            <input type="text" id="lname" name="Last_Name" required>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="Email" required>

            <label for="inquiry">Inquiry Type</label>
            <select id="inquiry" name="Inquiry_Type">
                <option value="Trail Status">Trail Status Update</option>
                <option value="General Question">General Question</option>
                <option value="Feedback">Website Feedback</option>
            </select>

            <label for="comments">Message / Details *</label>
            <textarea id="comments" name="Comments" rows="5" required></textarea>

            <button type="submit" class="cta-button">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Akyat-Tanaw | WDD 231</p>
        <p><a href="attributions.html">Attributions</a> | <a href="https://www.loom.com/share/820b914614204974ae889346a24ed0e6
"
              target="_blank" rel="noopener">Video Demonstration</a></p>
    </footer>
</body>

</html>
